<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>躬行楼地图校对工具 · 仅本地</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Microsoft YaHei",sans-serif;color:#173858;background:#f3f7fb}header{background:#143e72;color:white;padding:18px 25px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:20px;margin:0}small{color:#acc9e3}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:16px;max-width:1600px;margin:auto}aside,section{background:white;border:1px solid #dce8f2;border-radius:12px;overflow:hidden}aside{padding:18px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}h2{font-size:15px;margin:5px 0 14px}label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}input,select{width:100%;height:39px;border:1px solid #c8dbe9;border-radius:7px;padding:6px 9px;background:white;color:#173858}button{border:1px solid #bdd4e8;background:white;border-radius:7px;padding:8px 10px;color:#185d9d;cursor:pointer;font-weight:600}button:hover{background:#eaf4fd}.primary{background:#176ab8;color:white;border-color:#176ab8}.row{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.row>*{flex:1}p{font-size:12px;color:#687f95;line-height:1.6}.group{border-top:1px solid #e1ebf3;margin-top:17px;padding-top:13px}.canvas-wrap{height:calc(100vh - 115px);overflow:auto;background:#dce8f2;padding:20px}.stage{position:relative;width:100%;min-width:800px;box-shadow:0 9px 26px #28496533}.stage img{display:block;width:100%}.overlay{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}.overlay circle{stroke:white;stroke-width:2}.overlay line{stroke:#2380ce;stroke-width:3}.overlay text{font-size:11px;fill:#173858;paint-order:stroke;stroke:white;stroke-width:3}.status{font-size:12px;background:#e9f4ff;padding:10px;border-radius:7px;line-height:1.5}.list{max-height:145px;overflow:auto;border:1px solid #e1ebf3;border-radius:7px;margin:8px 0}.list button{border:0;border-radius:0;display:block;width:100%;text-align:left;font-size:11px;padding:7px}.list button:nth-child(even){background:#f5f9fc}@media(max-width:900px){main{display:block}aside{max-height:none;margin-bottom:12px}.canvas-wrap{height:65vh}}
</style></head><body><header><div><h1>躬行楼地图校对工具</h1><small>本地开发工具 · 请在确认现场通行关系后标记为已验证</small></div><span id="counts"></span></header><main><aside><h2>编辑数据</h2><label>楼层</label><select id="floor"></select><label>操作模式</label><select id="mode"><option value="inspect">查看 / 选择节点</option><option value="label">修正房间标签坐标</option><option value="entrance">添加房间入口</option><option value="node">添加通行节点</option></select><label>房间编号</label><input id="room" list="rooms" placeholder="选择待校对房间"><datalist id="rooms"></datalist><label>新节点类型</label><select id="node-type"><option value="corridor">走廊</option><option value="corner">转角</option><option value="entrance">房间入口</option><option value="stairs">楼梯</option><option value="elevator">电梯</option></select><label><input id="verified" type="checkbox" style="width:auto;height:auto"> 当前操作经现场验证</label><p id="status" class="status">点击地图可查看坐标。入口和节点必须通过现场核对。</p><div class="group"><h2>连接节点</h2><p>先在地图或下方列表选择节点 A、B，可跨楼层选择。跨层边只允许相同类型的楼梯或电梯。</p><div id="selection" class="status">未选择节点</div><div class="row"><button id="add-edge" class="primary">添加连接边</button><button id="remove-edge">删除连接边</button></div><div class="row"><button id="update-verification">更新选中项验证状态</button></div><label>边长（米，可留空）</label><input id="distance" type="number" min="0.01" step="0.01" placeholder="未测量则留空"><div id="nodes" class="list"></div><div id="edges" class="list"></div></div><div class="group"><h2>数据导入与导出</h2><p>导出的 rooms.json 与 graph.json 替换 public/data/ 中对应文件后提交。工具不会自动改动源数据。</p><label>导入房间 JSON</label><input id="import-rooms" type="file" accept=".json,application/json"><label>导入路径图 JSON</label><input id="import-graph" type="file" accept=".json,application/json"><div class="row"><button id="export-rooms" class="primary">导出 rooms.json</button><button id="export-graph" class="primary">导出 graph.json</button></div></div></aside><section><div class="canvas-wrap"><div class="stage" id="stage"><img id="map" alt="当前楼层原图"><svg id="overlay" class="overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg></div></div></section></main><script type="module" src="./editor.js"></script></body></html>
